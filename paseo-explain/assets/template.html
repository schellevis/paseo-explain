<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>{{TITLE}}</title>
<style>
:root{--bg:#0a0d12;--bg-2:#0f1419;--panel:#121821;--panel-2:#182030;--border:#1f2937;--border-2:#2a3650;--text:#e6edf7;--muted:#8492a8;--dim:#5a6679;
--mint:#46f9b8;--sky:#6aa9ff;--mag:#ff6b8a;--amber:#ffc14d;--violet:#b388ff;--brand-violet:#a201ff;
--mono:ui-monospace,SFMono-Regular,Menlo,monospace;--sans:system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 var(--sans);min-height:100vh;
background-image:radial-gradient(1200px 600px at 15% -10%,rgba(106,169,255,.07),transparent 60%),radial-gradient(1000px 500px at 100% 0%,rgba(162,1,255,.06),transparent 60%),radial-gradient(800px 600px at 50% 120%,rgba(70,249,184,.04),transparent 60%)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(ellipse at 50% 30%,#000 30%,transparent 75%)}
.top{position:sticky;top:0;z-index:5;display:flex;flex-direction:column;background:rgba(10,13,18,.82);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);font:12px var(--mono)}
.toprow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 28px;min-width:0}
.top b{color:var(--text);letter-spacing:.06em}.top .sp{flex:1}.top nav{display:flex;gap:6px;overflow-x:auto;padding:0 28px 10px;scrollbar-width:none;mask-image:linear-gradient(90deg,transparent,#000 28px,#000 calc(100% - 28px),transparent)}.top nav::-webkit-scrollbar{display:none}.top nav:empty{display:none}
.top nav a{display:inline-flex;align-items:center;gap:7px;flex:none;white-space:nowrap;padding:4px 12px 4px 5px;border:1px solid var(--border);border-radius:99px;background:rgba(255,255,255,.015);color:var(--muted);text-decoration:none;transition:color .15s,border-color .15s,background .15s}
.top nav a .tn{font-size:10px;color:var(--dim);border:1px solid var(--border);border-radius:99px;padding:1px 6px;transition:inherit}
.top nav a:hover{color:var(--text);border-color:var(--border-2)}.top nav a:focus-visible{outline:2px solid var(--sky);outline-offset:1px}
.top nav a[aria-current="true"]{color:var(--mint);border-color:rgba(70,249,184,.4);background:rgba(70,249,184,.07)}.top nav a[aria-current="true"] .tn{color:var(--mint);border-color:rgba(70,249,184,.4)}
section{scroll-margin-top:104px}
.badge{border:1px solid var(--border);border-radius:99px;padding:3px 10px;color:var(--muted);background:rgba(255,255,255,.015)}
.tbtn{font:11px var(--mono);border:1px solid var(--border);background:var(--panel);color:var(--muted);border-radius:99px;padding:3px 10px;cursor:pointer}.tbtn:hover{color:var(--text);border-color:var(--border-2)}
main{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:30px 28px 80px}
.kicker{display:inline-flex;align-items:center;gap:8px;font:11px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);padding:6px 10px;border:1px solid var(--border);border-radius:999px;background:rgba(255,255,255,.015)}
.kicker::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--mint);box-shadow:0 0 12px var(--mint)}
h1{font:600 clamp(28px,3.6vw,44px)/1.08 var(--sans);letter-spacing:-.02em;margin:16px 0 12px;background:linear-gradient(90deg,var(--mint),var(--sky) 50%,var(--brand-violet));-webkit-background-clip:text;background-clip:text;color:transparent;display:block;width:fit-content}
.lead{color:#c3cddd;font-size:17px;max-width:72ch;margin:0 0 22px}
.facts{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 26px;padding:0;list-style:none}
.facts li{font:10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:8px 12px}.facts li b{display:block;color:var(--text);font:500 14px var(--sans);letter-spacing:0;text-transform:none;margin-top:2px}
.hero{position:relative;background:radial-gradient(800px 400px at 50% 20%,rgba(106,169,255,.06),transparent 60%),linear-gradient(180deg,var(--panel),var(--bg-2));border:1px solid var(--border);border-radius:18px;padding:18px 20px 12px;box-shadow:0 10px 30px rgba(0,0,0,.45);overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(circle at 50% 40%,#000 30%,transparent 80%)}
.hero svg{position:relative;width:100%;height:auto;display:block;touch-action:none;user-select:none}
.hero .cap{position:relative;font:11px var(--mono);color:var(--dim);margin:4px 2px}
.hh{position:relative;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.hh .t{font:11px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.player{display:flex;gap:6px;align-items:center;font:11px var(--mono);color:var(--muted)}
.player button{border:1px solid var(--border);background:var(--panel-2);color:var(--muted);cursor:pointer;height:30px;min-width:30px;padding:0 10px;border-radius:8px;font:11px var(--mono)}
.player button:hover{color:var(--text);border-color:var(--border-2)}.player button.on{background:rgba(70,249,184,.12);border-color:var(--mint);color:var(--mint)}
.stepbox{position:relative;margin-top:8px;border:1px solid var(--border);border-left:3px solid var(--mint);background:rgba(70,249,184,.04);border-radius:10px;padding:10px 14px;font-size:14px;color:#c3cddd;min-height:44px}
.stepbox .i{font:600 11px var(--mono);color:var(--mint);margin-right:8px}
.progress{position:relative;height:3px;background:var(--border);border-radius:2px;margin-top:8px}.progress i{display:block;height:100%;width:0;background:var(--mint);box-shadow:0 0 8px rgba(70,249,184,.4);transition:width .35s}
.n rect{fill:var(--panel-2);stroke:var(--border-2);stroke-width:1.2;transition:all .25s}.n text{font:500 14px var(--sans);fill:var(--text)}.n .sub{font:11px var(--mono);fill:var(--muted)}
.n.new rect{stroke:var(--mint);fill:rgba(70,249,184,.06)}.n.external rect{stroke:var(--sky);stroke-dasharray:4 3}
.n{cursor:grab;transition:opacity .3s}.n.drag{cursor:grabbing}.n:hover rect,.n.sel rect{stroke:var(--sky);stroke-width:2}
.n.lit rect{stroke:var(--mint);stroke-width:2.2;filter:drop-shadow(0 0 10px rgba(70,249,184,.55))}.dimmed .n:not(.lit){opacity:.35}
.e{stroke:#3a4760;stroke-width:1.4;fill:none}.e.new{stroke:var(--mint);stroke-opacity:.7;stroke-dasharray:5 5}
.el{font:11px var(--mono);fill:var(--dim);paint-order:stroke;stroke:var(--panel);stroke-width:5px;stroke-linejoin:round}.zone{fill:none;stroke:var(--border-2);stroke-dasharray:3 5}.zone.new{stroke:var(--mint);stroke-opacity:.5}.zl{font:10px var(--mono);letter-spacing:.16em;fill:var(--dim)}.zl.new{fill:var(--mint)}
.pkt{fill:var(--mint);filter:drop-shadow(0 0 6px var(--mint))}
section{margin-top:48px}h2{font:600 22px/1.2 var(--sans);letter-spacing:-.01em;margin:0 0 4px}.sub2{color:var(--muted);margin:0 0 16px;font-size:14.5px}
.num{font:600 11px var(--mono);color:var(--mint);margin-right:10px;border:1px solid rgba(70,249,184,.35);border-radius:6px;padding:2px 6px;vertical-align:3px}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.col,.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.col h3{margin:0 0 8px;font:600 10.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}.col.next{border-color:rgba(70,249,184,.45)}.col.next h3{color:var(--mint)}
.col ul{margin:0;padding-left:18px;color:#c3cddd}.col li{margin:4px 0}.col li::marker{color:var(--dim)}
.mm{position:relative;display:flex;justify-content:center}.mm svg{width:100%!important;max-width:880px!important;height:auto!important}.mm pre{width:100%;margin:0;display:flex;justify-content:center}.mm pre.staging{position:absolute;left:0;top:0;width:100%;height:1px;overflow:hidden;opacity:0;pointer-events:none}
table{border-collapse:separate;border-spacing:0;width:100%;background:var(--panel);border:1px solid var(--border);border-radius:14px;overflow:hidden;font-size:14px}
th{font:600 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);background:var(--bg-2)}
th,td{padding:9px 10px;border-bottom:1px solid var(--border);text-align:center}th:first-child,td:first-child,td:nth-child(2){text-align:left}tr:last-child td{border-bottom:0}
tr.r{cursor:pointer}tr.r:hover,tr.r.sel{background:rgba(106,169,255,.07)}td.x{color:var(--sky);text-shadow:0 0 8px rgba(106,169,255,.6)}td.gap{color:var(--mag);font:600 11px var(--mono)}td.okc{color:var(--mint)}
.dec{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.dec .card.chosen{border-color:var(--mint);box-shadow:0 0 0 1px rgba(70,249,184,.25),0 0 30px rgba(70,249,184,.08)}
.dec .k,.risks .k{font:600 10.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}.dec .chosen .k{color:var(--mint)}.dec h4,.risks h4{margin:4px 0 6px;font-size:15.5px}.dec p,.risks p{margin:0;font-size:14px;color:var(--muted)}
.risks{display:grid;grid-template-columns:1fr 1fr;gap:14px}.risks .card.risk .k{color:var(--mag)}.risks .card.open_question .k{color:var(--amber)}.risks .card.assumption .k{color:var(--violet)}
.example .ex-block{margin-bottom:14px}.example h3{margin:0 0 4px;font:600 10.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}.example p{margin:0}
details{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px 16px;margin-bottom:10px}summary{cursor:pointer;font-weight:500}summary::marker{color:var(--mint)}details p{color:var(--muted);margin:8px 0 0}
.chip{font:600 10.5px var(--mono);border:1px solid var(--border-2);background:rgba(255,255,255,.04);color:var(--muted);border-radius:6px;padding:1px 6px;margin:0 2px;cursor:pointer}.chip:hover{border-color:var(--sky);color:var(--sky)}
aside{position:fixed;top:0;right:0;height:100%;width:380px;max-width:92vw;background:var(--panel);border-left:1px solid var(--border-2);box-shadow:-20px 0 60px rgba(0,0,0,.5);transform:translateX(105%);transition:transform .22s;z-index:10;padding:22px;overflow:auto}
aside.open{transform:none}aside .x{float:right;border:0;background:none;font-size:20px;cursor:pointer;color:var(--muted)}aside h3{margin:10px 0 6px;font:600 20px var(--sans)}aside p{color:#c3cddd}
aside .src{background:var(--bg-2);border:1px solid var(--border);border-left:3px solid var(--sky);border-radius:8px;padding:8px 10px;margin:10px 0;font-size:13px;color:var(--muted);white-space:pre-wrap}aside .src b{font-family:var(--mono);color:var(--sky)}
aside .src.flagged{border-left-color:var(--amber)}
.note{font:11px var(--mono);color:var(--dim);margin-top:50px;border-top:1px solid var(--border);padding-top:12px}
@media(max-width:760px){.cols,.dec,.risks{grid-template-columns:1fr}.top nav{display:none}}
@media(min-width:1100px){.toprow,.levels{flex-wrap:nowrap}}
/* light theme */
body.light{--bg:#f6f7fa;--bg-2:#ffffff;--panel:#ffffff;--panel-2:#f1f3f8;--border:#e2e6ee;--border-2:#c8d0dd;--text:#0f1419;--muted:#555f70;--dim:#8492a8;--mint:#00b377;--sky:#2a6fdb;--mag:#d63a5f;--amber:#c98a00;--violet:#7a4ed1;--brand-violet:#7a1cd9;
background-image:radial-gradient(1200px 600px at 15% -10%,rgba(42,111,219,.06),transparent 60%),radial-gradient(1000px 500px at 100% 0%,rgba(122,28,217,.05),transparent 60%)}
body.light::before{background-image:linear-gradient(rgba(15,20,25,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(15,20,25,.035) 1px,transparent 1px)}
body.light .top{background:rgba(246,247,250,.85)}
body.light .lead,body.light .col ul,body.light aside p,body.light .stepbox{color:#2b3442}
body.light .hero{background:linear-gradient(180deg,#fff,#f8f9fc);box-shadow:0 10px 30px rgba(15,20,25,.08)}
body.light .hero::before{background-image:linear-gradient(rgba(15,20,25,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(15,20,25,.04) 1px,transparent 1px)}
body.light .col,body.light .card{box-shadow:0 6px 20px rgba(15,20,25,.06)}
body.light .e{stroke:#9aa5b8} body.light .n.new rect{fill:rgba(0,179,119,.07)}
body.light .n.lit rect{filter:drop-shadow(0 0 8px rgba(0,179,119,.45))} body.light .pkt{filter:drop-shadow(0 0 5px rgba(0,179,119,.8))}
body.light .dec .card.chosen{box-shadow:0 0 0 1px rgba(0,179,119,.25),0 8px 24px rgba(0,179,119,.10)}
body.light .stepbox{background:rgba(0,179,119,.05)} body.light aside{box-shadow:-20px 0 60px rgba(15,20,25,.15)}
body.light .top nav a[aria-current="true"]{background:rgba(0,179,119,.08)} body.light td.x{text-shadow:none} body.light tr.r:hover,body.light tr.r.sel{background:rgba(42,111,219,.06)}


.figcap{position:relative;font:11px var(--mono);color:var(--dim);margin:8px 2px 0}
button.chip{font:600 10.5px var(--mono);letter-spacing:0;text-transform:none;border:1px solid var(--border-2);background:rgba(255,255,255,.04);color:var(--muted);border-radius:6px;padding:1px 6px;margin:0 2px;cursor:pointer}
button.chip:hover{border-color:var(--sky);color:var(--sky)}
.tbtn.on{color:var(--mint);border-color:var(--mint)}
.tbtn:disabled{opacity:.38;cursor:not-allowed}
.levels{display:inline-flex;gap:4px;flex-wrap:wrap;align-items:center}
.banner{border:1px solid var(--border);border-left:3px solid var(--sky);background:var(--panel);border-radius:10px;padding:10px 14px;margin:0 0 22px;color:var(--muted);font-size:14px}
.banner p{margin:4px 0}
.banner .flag{color:var(--amber)}
.quote{font-style:italic;color:var(--muted);border-left:3px solid var(--sky);margin:6px 0 2px;padding:2px 0 2px 10px}.quote .chip{font-style:normal}
.conf{font:600 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--amber);margin-right:6px}
.evrow{margin:6px 0 10px}
abbr.term{border-bottom:1px dotted var(--muted);text-decoration:none;cursor:help}
.facts .chip,.facts .conf,.facts .evrow,.facts .term{text-transform:none;letter-spacing:0}
.prose p{margin:0 0 12px;color:#c3cddd}
body.light .prose p{color:#2b3442}
.mmnote{font:12px var(--mono);color:var(--amber);margin:8px 0}
.mmnote:empty{display:none}
.cov{overflow-x:auto}
.map td,.map th{text-align:left;vertical-align:top}.map td:first-child{white-space:nowrap}
.steps{margin:0;padding-left:22px}.steps li{margin:0 0 14px}.steps h4{margin:0 0 4px;font-size:15.5px}.steps p{margin:0 0 6px;font-size:14px;color:var(--muted)}.steps pre{margin:6px 0;padding:8px 10px;border:1px solid var(--border);border-radius:10px;background:var(--bg-2);overflow-x:auto;font:13px var(--mono)}
.gap{color:var(--mag);font:600 11px var(--mono)}
th .chip.sel,.chip.sel{border-color:var(--sky);color:var(--sky)}
.n:focus{outline:none}
.n:focus rect{stroke:var(--sky);stroke-width:2}
.pkt.hide{opacity:0}
.e,.el,.zone,.zl,.pkt{pointer-events:none}
aside .actions{display:flex;flex-direction:column;gap:8px;margin-top:16px}
aside .actions button{font:13px var(--sans);text-align:left;border:1px solid var(--border);background:var(--panel-2);color:var(--text);border-radius:8px;padding:8px 10px;cursor:pointer}
aside .actions button:hover{border-color:var(--sky)}
.copybox{width:100%;margin-top:10px;font:12px var(--mono);color:var(--text);background:var(--bg-2);border:1px solid var(--border);border-radius:8px;padding:8px}
h1 .term{background:linear-gradient(90deg,var(--mint),var(--sky) 50%,var(--brand-violet));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;border-bottom-color:var(--sky)}
dl{margin:0}
dt{font-weight:600;margin-top:10px}
dd{margin:2px 0 0;color:var(--muted)}
@media print{
.top,.player,aside,.tbtn{display:none}
body{background:#fff;color:#111;--text:#111;--muted:#333;--dim:#444;--bg:#fff;--panel:#fff;--panel-2:#f6f7fa;--border:#ccc;--border-2:#bbb}
body::before{display:none}
h1,h1 .term{background:none;color:#111;-webkit-text-fill-color:#111}
.lead,.prose p,.col ul,.stepbox{color:#222}
details,details > *{display:block !important}
details{break-inside:avoid}
}

</style>

  function svgPoint(ev) {
    var pt, ctm, p;
    if (!svg || !svg.createSVGPoint) return {x: 0, y: 0};
    pt = svg.createSVGPoint();
    pt.x = ev.clientX;
    pt.y = ev.clientY;
    ctm = svg.getScreenCTM();
    if (!ctm) return {x: 0, y: 0};
    p = pt.matrixTransform(ctm.inverse());
    return {x: p.x, y: p.y};

    p = svgPoint(ev);

    dy = p.y - drag.sy;
    if (Math.sqrt(dx * dx + dy * dy) >= 4) drag.moved = true;
    if (!drag.moved) return;
    drag.n.x = snap(drag.ox + dx);
    drag.n.y = snap(drag.oy + dy);
    clampNode(drag.n);
    placeNode(drag.n);
    drawEdges();

    var token = ++packetAnim;
    var x1, y1, x2, y2, start;
    if (!a || !b) { hidePacket(); return; }
    x1 = a.x + a.w / 2;
    y1 = a.y + a.h / 2;
    x2 = b.x + b.w / 2;
    y2 = b.y + b.h / 2;
    if (reducedMotion()) { hidePacket(); return; }
    start = null;
    function frame(now) {
      var u;

      labelNode = null;

        labelNode = el("text", {"class": "el", "text-anchor": "middle", "dominant-baseline": "middle"}, e.label);
      }
      edgeG.appendChild(line);
      if (labelNode) edgeG.appendChild(labelNode);
      edgeList.push({from: e.from, to: e.to, line: line, labelEl: labelNode});
    }
    packet = el("circle", {"class": "pkt hide", r: 6, cx: 0, cy: 0, "aria-hidden": "true"});
    svg.appendChild(zoneG);
    svg.appendChild(edgeG);
    svg.appendChild(nodeG);
    svg.appendChild(packet);
    head.appendChild(el("span", {"class": "t"}, t("overview")));
    if (steps.length) {
      player.appendChild(button("‹", t("prev"), "", function () {
        stopPlay();
        if (stepIndex > 0) goStep(stepIndex - 1);
        else if (stepIndex === 0) showOverview();
      }));
      var playBtn = button(t("play"), t("play"), "", function () { togglePlay(playBtn, steps); });
      player.appendChild(playBtn);
      player.appendChild(button("›", t("next"), "", function () {
        stopPlay();
        if (stepIndex < steps.length - 1) goStep(stepIndex + 1);
      }));
      var counter = el("span", {"aria-label": t("step")});
      player.appendChild(counter);
      head.appendChild(player);
    }
    head.appendChild(button(t("reset"), t("reset"), "tbtn", resetLayout));
    box.appendChild(head);
    box.appendChild(svg);
    bindText(cap, hero.caption, {aria: svg});
    box.appendChild(cap);
    var stepBox = null, stepI = null, stepText = null, stepChips = null, bar = null, stepEntry = null;
    if (steps.length) {
      stepBox = el("div", {"class": "stepbox", "aria-live": "polite"});
      stepI = el("span", {"class": "i"});
      stepText = el("span");
      stepChips = el("span");
      stepBox.appendChild(stepI);
      stepBox.appendChild(stepText);
      stepBox.appendChild(stepChips);
      stepEntry = bindText(stepText, t("stepHint"));
      bar = el("i");
      var progress = el("div", {"class": "progress"});
      progress.appendChild(bar);
      box.appendChild(stepBox);
      box.appendChild(progress);
    }
    document.addEventListener("pointermove", onPointerMove);
    document.addEventListener("pointerup", onPointerUp);
    function goStep(i) {
      var step, id, k, lit;
      if (!steps.length || i < 0 || i >= steps.length) return;
      stepIndex = i;
      step = steps[i] || {};
      counter.textContent = (i + 1) + " / " + steps.length;
      stepI.textContent = String(i + 1);
      stepEntry.value = step.text;
      applyOne(stepEntry, level);
      bar.style.width = ((i + 1) / steps.length * 100) + "%";
      svg.classList.add("dimmed");
      for (id in nodeMap) {
        if (Object.prototype.hasOwnProperty.call(nodeMap, id)) nodeMap[id].g.classList.remove("lit");
      }
      lit = arr(step.nodes);
      for (k = 0; k < lit.length; k++) {
        if (nodeMap[lit[k]]) nodeMap[lit[k]].g.classList.add("lit");
      }
      stepChips.textContent = "";
      rowAppend(stepChips, chips(step.evidence, {title: t("step") + " " + (i + 1), detail: step.text, confidence: null}));
      if (step.from && step.to) animatePacket(step.from, step.to);
      else hidePacket();
    }
    function showOverview() {
      var id;
      if (!steps.length) return;
      stepIndex = -1;
      counter.textContent = "– / " + steps.length;
      stepI.textContent = "";
      stepEntry.value = t("stepHint");
      applyOne(stepEntry, level);
      bar.style.width = "0%";
      svg.classList.remove("dimmed");
      for (id in nodeMap) {
        if (Object.prototype.hasOwnProperty.call(nodeMap, id)) nodeMap[id].g.classList.remove("lit");
      }
      stepChips.textContent = "";
      hidePacket();
    }
    function stopPlay() {
      if (playTimer) {
        clearInterval(playTimer);
        playTimer = null;
      }
      if (steps.length) {
        var btn = player.querySelector("button.on") || player.children[1];
        var paused = steps[stepIndex] || {};
        if (btn) {
          btn.classList.remove("on");
          btn.textContent = t("play");
          setAttr(btn, "aria-label", t("play"));
        }
        if (!paused.from || !paused.to) hidePacket();
      }
    }
    function togglePlay(playBtn, stepList) {
      if (playTimer) { stopPlay(); return; }
      if (stepIndex < 0 || stepIndex >= stepList.length - 1) goStep(0);
      playBtn.classList.add("on");
      playBtn.textContent = t("pause");
      setAttr(playBtn, "aria-label", t("pause"));
      playTimer = setInterval(function () {
        if (stepIndex >= stepList.length - 1) { stopPlay(); return; }
        goStep(stepIndex + 1);
        if (stepIndex >= stepList.length - 1) stopPlay();
      }, 2200);
    }
    box._goStep = goStep;
    box._showOverview = showOverview;
    box._steps = steps;
    return box;
  }

  function navSpy(nav) {
    var links = nav.getElementsByTagName("a");
    var current = null;
    var visible = {};
    var observer, i, target;
    function mark(link) {
      if (link === current) return;
      if (current) current.removeAttribute("aria-current");
      current = link;
      if (!link) return;
      setAttr(link, "aria-current", "true");
      if (link.offsetLeft < nav.scrollLeft + 28 || link.offsetLeft + link.offsetWidth > nav.scrollLeft + nav.clientWidth - 28) {
        nav.scrollLeft = link.offsetLeft - (nav.clientWidth - link.offsetWidth) / 2;
      }
    }
    if (!links.length || typeof IntersectionObserver !== "function") return;
    observer = new IntersectionObserver(function (entries) {
      var j, k;
      for (j = 0; j < entries.length; j++) visible[entries[j].target.id] = entries[j].isIntersecting;
      for (k = 0; k < links.length; k++) {
        if (visible[links[k].getAttribute("href").slice(1)]) { mark(links[k]); return; }
      }
    }, {rootMargin: "-110px 0px -55% 0px"});
    for (i = 0; i < links.length; i++) {
      target = document.getElementById(links[i].getAttribute("href").slice(1));
      if (target) observer.observe(target);
    }
  }

  function build() {
    var anchor = document.getElementById("pe-data");
    var top = el("header", {"class": "top"});
    var row = el("div", {"class": "toprow"});
    var nav = el("nav", {"aria-label": t("explanation")});
    var main = el("main");
    var kicker = el("div", {"class": "kicker"});
    var h1 = el("h1");
    var lead = el("p", {"class": "lead"});
    var facts = el("ul", {"class": "facts"});
    var banner = el("div", {"class": "banner", role: "status"});
    var factList = arr(explain.facts);
    var sections = arr(explain.sections);
    var gloss = arr(explain.glossary);
    var i, fact, li, b, hero, heroBox, secEl, dl, dt, dd, skipped, grade;
    document.body.classList.toggle("light", theme === "light");
    function themeTarget() { return theme === "light" ? t("dark") : t("light"); }
    function syncThemeButton(btn) {
      btn.textContent = themeTarget();
      setAttr(btn, "aria-label", t("theme") + ": " + themeTarget());
      setAttr(btn, "aria-pressed", theme === "light" ? "true" : "false");
    }
    function applyTheme(next) {
      if (next === theme) return;
      theme = next;
      document.body.classList.toggle("light", theme === "light");
      syncThemeButton(themeBtn);
      if (globalThis.mermaid) renderMermaid();
    }
    row.appendChild(el("b", {}, "paseo-explain"));
    row.appendChild(el("span", {"class": "badge"}, kindName()));
    var levelsWrap = el("span", {"class": "levels"});
    for (i = 1; i <= 5; i++) {
      (function (n) {
        var name = L.levels[n];
        var writtenStop = written.indexOf(n) >= 0;
        var btn = el("button", {"class": "tbtn", "aria-label": name, "aria-pressed": n === level ? "true" : "false"});
        btn._lv = n;
        btn.appendChild(document.createTextNode(name));
        if (!writtenStop) {
          btn.disabled = true;
          setAttr(btn, "title", t("notGenerated"));
        }
        if (n === level) btn.classList.add("on");
        btn.addEventListener("click", function () { if (!btn.disabled) setLevel(n, true); });
        levelButtons.push(btn);
        levelsWrap.appendChild(btn);
      })(i);
    }
    row.appendChild(levelsWrap);
    row.appendChild(el("span", {"class": "sp"}));
    var themeBtn = button(themeTarget(), t("theme") + ": " + themeTarget(), "tbtn", function () {
      followOS = false;
      applyTheme(theme === "light" ? "dark" : "light");
      storageSet("paseo-explain.theme", theme);
    });
    syncThemeButton(themeBtn);
    if (followOS && themeMedia) {
      var onOSThemeChange = function (event) {
        if (followOS) applyTheme(event.matches ? "light" : "dark");
      };
      try {
        if (typeof themeMedia.addEventListener === "function") themeMedia.addEventListener("change", onOSThemeChange);
        else if (typeof themeMedia.addListener === "function") themeMedia.addListener(onOSThemeChange);
      } catch (e) {}
    }
    row.appendChild(themeBtn);
    top.appendChild(row);
    top.appendChild(nav);
    kicker.appendChild(document.createTextNode(t("explanation") + " · " + kindName()));
    h1.appendChild(document.createTextNode(explain.title || ""));
    wrapGlossary(h1);
    bindText(lead, explain.lead && explain.lead.text);
    main.appendChild(kicker);
    main.appendChild(h1);
    main.appendChild(lead);
    rowAppend(main, evidenceRow(explain.lead && explain.lead.evidence, explain.lead && explain.lead.confidence, {
      title: explain.title || "",
      detail: explain.lead && explain.lead.text,
      confidence: explain.lead && explain.lead.confidence
    }));
    for (i = 0; i < factList.length; i++) {
      fact = factList[i] || {};
      li = el("li");
      staticWrap(li, fact.label || "");
      b = el("b");
      staticWrap(b, fact.value || "");
      li.appendChild(b);
      rowAppend(li, evidenceRow(fact.evidence, fact.confidence, {
        title: fact.label || "",
        detail: fact.value || "",
        confidence: fact.confidence
      }));
      facts.appendChild(li);
    }
    main.appendChild(facts);
    banner.appendChild(el("p", {}, factText()));
    if (meta.depth === "docs") banner.appendChild(el("p", {}, t("depthDocs")));
    else if (meta.depth === "code") banner.appendChild(el("p", {}, fill(t("depthCode"), {n: meta.code_excerpts || 0})));
    skipped = meta.skipped || {};
    if (skipped.fact_check) banner.appendChild(el("p", {}, fill(t("skip"), {reason: skipped.fact_check})));
    if ((meta.mode === "deep" || meta.mode === "standard") && meta.reader_grade && meta.reader_grade.total != null) {
      grade = meta.reader_grade;
      banner.appendChild(el("p", {}, grade.total === 0 ? t("readerUnscored") : fill(t("reader"), {correct: grade.correct, total: grade.total})));
    }
    var notice = flaggedNotice();
    if (notice) banner.appendChild(el("p", {"class": "flag"}, notice));
    main.appendChild(banner);
    hero = explain.hero || {};
    heroBox = buildHero(hero);
    main.appendChild(heroBox);
    for (i = 0; i < sections.length; i++) {
      secEl = renderSection(sections[i] || {}, i);
      main.appendChild(secEl);
      nav.appendChild(el("a", {href: "#" + (secEl.id || "")}, el("span", {"class": "tn", "aria-hidden": "true"}, pad2(i + 1)), (sections[i] && sections[i].title) || ""));
    }
    if (gloss.length) {
      var gsec = el("section", {id: "glossary"});
      gsec.appendChild(el("h2", {}, t("glossary")));
      dl = el("dl");
      for (i = 0; i < gloss.length; i++) {
        dt = el("dt");
        dt.appendChild(document.createTextNode(gloss[i].term || ""));
        dd = el("dd");
        staticWrap(dd, gloss[i].definition || "");
        dl.appendChild(dt);
        dl.appendChild(dd);
      }
      gsec.appendChild(dl);
      main.appendChild(gsec);
      nav.appendChild(el("a", {href: "#glossary"}, el("span", {"class": "tn", "aria-hidden": "true"}, "Aa"), t("glossary")));
    }
    main.appendChild(el("p", {"class": "note"}, footerText()));
    aside = el("aside", {"aria-label": t("evidence")});
    aside.appendChild(button("×", t("close"), "x", function () { aside.classList.remove("open"); }));
    panelTitle = el("h3");
    panelDetail = el("p");
    panelConf = el("div");
    panelEv = el("div");
    panelEntry = bindText(panelDetail, "");
    aside.appendChild(panelTitle);
    aside.appendChild(panelDetail);
    aside.appendChild(panelConf);
    aside.appendChild(panelEv);
    var actions = el("div", {"class": "actions"});
    actions.appendChild(button(t("simpler"), t("simpler"), "", function () { copyText(followup("simpler")); }));
    actions.appendChild(button(t("why"), t("why"), "", function () { copyText(followup("why")); }));
    actions.appendChild(button(t("drop"), t("drop"), "", function () { copyText(followup("drop")); }));
    aside.appendChild(actions);
    document.addEventListener("keydown", function (ev) {
      if (ev.key === "Escape") aside.classList.remove("open");
    });
    window.addEventListener("beforeprint", function () {
      var ds = document.querySelectorAll("details");
      var n;
      for (n = 0; n < ds.length; n++) ds[n].open = true;
    });
    document.body.insertBefore(top, anchor);
    document.body.insertBefore(main, anchor);
    document.body.insertBefore(aside, anchor);
    navSpy(nav);
    var ids = Object.keys(nodeMap);
    for (i = 0; i < ids.length; i++) fitWidth(nodeMap[ids[i]]);
    drawEdges();
    applySavedLayout();
    if (heroBox._steps && heroBox._steps.length) heroBox._showOverview();
  }

  build();
  armMermaid();
})();
</script>
</body>
</html>
